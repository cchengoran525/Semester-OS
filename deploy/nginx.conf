# Semester OS 静态站点配置。
# 应用使用 HashRouter（#/tasks 等路由不经过服务端），理论上无需 SPA fallback，
# 但保留 try_files 兜底，直接访问任意路径也能回到应用。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 容器健康检查端点
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # 带 hash 的构建产物：内容不变即可永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口 HTML 不缓存，保证发新版本后用户能立刻拿到新资源引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
